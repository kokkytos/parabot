name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: paragliding-2026
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  AR_REPOSITORY: parabot
  IMAGE_NAME: parabot
  CLOUD_RUN_SERVICE: parabot

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate to Google Cloud ────────────────────────────────────────
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      # ── Configure Docker to push to Artifact Registry ───────────────────────
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
          gcloud auth print-access-token | \
            docker login -u oauth2accesstoken --password-stdin \
            https://${{ env.GCP_REGION }}-docker.pkg.dev

      # ── Build & push image ──────────────────────────────────────────────────
      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build --tag "${IMAGE}:${{ github.sha }}" --tag "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      # ── Get existing service URL (empty on first deploy) ────────────────────
      - name: Get existing Cloud Run URL
        id: existing
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null || true)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # ── Deploy to Cloud Run ─────────────────────────────────────────────────
      # WEBHOOK_URL uses the pre-existing service URL when available.
      # On the very first deploy it will be empty; the "Fix WEBHOOK_URL" step
      # below immediately patches it with the real URL after the service exists.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          secrets: |
            TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest
            AIRTABLE_TOKEN=AIRTABLE_TOKEN:latest
            AIRTABLE_BASE_ID=AIRTABLE_BASE_ID:latest
            OPENWEATHER_API_KEY=OPENWEATHER_API_KEY:latest
            WU_API_KEY=WU_API_KEY:latest
            WEBHOOK_SECRET=WEBHOOK_SECRET:latest
            DAILY_TRIGGER_TOKEN=DAILY_TRIGGER_TOKEN:latest
          env_vars: |
            WEBHOOK_URL=${{ steps.existing.outputs.url }}
            MINI_APP_URL=${{ steps.existing.outputs.url }}
            WU_STATION_ID=IGRIKA1
            WU_SEVASTO_STATION_ID=ISEVAS24
          flags: |
            --min-instances=1
            --max-instances=1
            --memory=256Mi
            --cpu=1
            --concurrency=80
            --timeout=60s
            --allow-unauthenticated
            --no-traffic

      # ── Patch WEBHOOK_URL and migrate traffic ───────────────────────────────
      # Sets the real URL (now known) and sends 100% traffic to the new revision.
      - name: Fix WEBHOOK_URL and migrate traffic
        run: |
          gcloud run services update ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --update-env-vars="WEBHOOK_URL=${{ steps.deploy.outputs.url }},MINI_APP_URL=${{ steps.deploy.outputs.url }}"
          gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --to-latest

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
